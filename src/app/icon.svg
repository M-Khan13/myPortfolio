<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="FK">
  <!--
    The nav monogram as a favicon. Drawn on a plate rather than as bare marks
    so it reads on light and dark browser chrome alike, in the theme's own
    colours: --background for the plate, --foreground for the letters.

    The letterforms are geometric strokes, not live text — no font has to load,
    and nothing shifts if one fails to. Sized for legibility at tab scale: on a
    retina display a 16px tab renders this at 32 device pixels.
  -->
  <rect width="64" height="64" rx="13" fill="#0a0a0c"/>
  <g stroke="#e7e7ea" stroke-width="7" stroke-linecap="butt" fill="none">
    <path d="M15 17 V47"/><path d="M15 20.5 H30"/><path d="M15 32 H27"/>
    <path d="M38 17 V47"/><path d="M38 32 L49 20.5"/><path d="M38 32 L49 43.5"/>
  </g>
</svg>
